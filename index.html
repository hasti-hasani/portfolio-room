<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="description" content="A walk-through 3D studio: projects, articles, certificates and garments.">
<title>My Studio</title>
<link rel="stylesheet" href="/src/styles.css">
</head>
<body>
<div id="scene"></div>
<div id="hotspots"></div>

<div id="hud">
  <button class="chip-btn" id="mood-btn"></button>
  <button class="chip-btn" id="sound-btn" aria-pressed="true">Sound on</button>
</div>
<button id="quality"></button>
<div id="hint"></div>

<aside id="panel" role="dialog" aria-labelledby="panel-title" aria-hidden="true">
  <div class="panel-head">
    <h2 id="panel-title"></h2>
    <button class="close" id="panel-close" aria-label="Close">×</button>
  </div>
  <div class="panel-body" id="panel-body"></div>
</aside>

<div class="overlay" id="intro">
  <div class="intro-card">
    <div class="eyebrow">Portfolio</div>
    <h1 id="intro-title">Welcome to my studio</h1>
    <p id="intro-tagline"></p>
    <button class="btn" id="enter" disabled>Preparing the studio…</button>
  </div>
</div>

<div class="overlay hidden" id="simple">
  <div class="simple-inner" id="simple-inner"></div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
